<!DOCTYPE html>

<html>

  <head>

    <meta charset="utf-8" />

  <link rel="stylesheet" href="https://code.getmdl.io/1.3.0/material.blue_grey-orange.min.css" />

    <title>Number Guesser If Statement, with JavaScript</title>

  </head>

  <body>

    <script defer src="https://code.getmdl.io/1.3.0/material.min.js"></script>

    <script src="./js/script.js"></script>

    <div class="mdl-layout mdl-js-layout mdl-layout--fixed-header">

      <header class="mdl-layout__header">

        <div class="mdl-layout__header-row">

          <span class="mdl-layout-title">Number Guesser If Statement, with JS</span>

        </div>

      </header>

      <main class="mdl-layout__content">

        <table>

          <tr>

            <th>

            </th>

            <th>

            </th>

          </tr>

        </table>

        <h1>Random Number Guessing Game!</h1>

        <!-- Simple Textfield -->

        <label for="guess">Enter a number between 1-10!: </label>

        <input type="number" id="guess" step="1" min="1" max="10">

        <br>







        <!-- Raised button with ripple -->

        <button

          class="mdl-button mdl-js-button mdl-button--raised mdl-js-ripple-effect mdl-button--accent"

          onclick="guess()"

        >

          Submit Guess!

        </button>

        <br />

        <p>

          <div id="result"></div>

        </p>

      </main>

    </div>

  </body>
